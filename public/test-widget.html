<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Your Receptionist</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #6c63ff;
      --accent-light: #ede9fe;
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --radius: 12px;
      --user-bg: var(--accent);
      --user-text: #fff;
      --bot-bg: #f1f1f3;
      --bot-text: var(--text);
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 680px;
      height: min(700px, calc(100vh - 32px));
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      padding: 16px 20px;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header-icon {
      width: 38px; height: 38px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header-text { flex: 1; min-width: 0; }
    .header-name { font-size: 15px; font-weight: 600; }
    .header-sub { font-size: 12px; opacity: 0.8; margin-top: 1px; }
    .header-actions { display: flex; gap: 8px; }
    .btn-icon {
      background: rgba(255,255,255,0.15);
      border: none; color: white; cursor: pointer;
      width: 32px; height: 32px; border-radius: 8px;
      font-size: 15px; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .btn-icon:hover { background: rgba(255,255,255,0.25); }

    /* ── Notice banner ── */
    .notice {
      padding: 8px 16px;
      background: #fffbeb;
      border-bottom: 1px solid #fde68a;
      font-size: 12px;
      color: #92400e;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 8px;
      max-width: 85%;
      animation: fadeUp 0.15s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      background: var(--accent-light);
      align-self: flex-end;
    }
    .msg.user .avatar { background: rgba(108,99,255,0.15); }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
    }
    .msg.bot  .bubble { background: var(--bot-bg); color: var(--bot-text); border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }

    /* Typing dots */
    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
      animation: blink 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.9); }
      40%            { opacity: 1;   transform: scale(1);   }
    }

    /* ── Input ── */
    .input-bar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
      background: var(--surface);
    }
    .input-bar textarea {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 9px 14px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }
    .input-bar textarea:focus { border-color: var(--accent); }
    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }
    .send-btn:hover { opacity: 0.9; }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <div class="header-icon">🤖</div>
    <div class="header-text">
      <div class="header-name" id="receptionist-name">AI Receptionist</div>
      <div class="header-sub" id="business-name">Loading...</div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btn-reset" title="Start new conversation">↺</button>
    </div>
  </div>

  <div class="notice">
    This is a text simulation of your AI phone receptionist — useful for testing responses before going live.
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-bar">
    <textarea id="input" rows="1" placeholder="Type a message as a caller would…"></textarea>
    <button class="send-btn" id="send-btn" disabled>➤</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send-btn');

  let history = [];
  let sessionId = 'test-' + Math.random().toString(36).slice(2);
  let busy = false;

  // ── Startup: load business info and greeting ──────────────────────────────

  async function init() {
    // Load names
    try {
      const res = await fetch('/api/status');
      if (res.ok) {
        const data = await res.json();
        if (data.businessName) document.getElementById('business-name').textContent = data.businessName;
        if (data.receptionistName) document.getElementById('receptionist-name').textContent = data.receptionistName;
      }
    } catch (_) {}

    // Load and display greeting
    try {
      const res = await fetch('/api/greeting');
      const data = await res.json();
      const greeting = data.greeting || 'Hello! How can I help you today?';
      appendBubble('bot', greeting);
      history.push({ role: 'assistant', content: greeting });
    } catch (_) {
      appendBubble('bot', 'Hello! How can I help you today?');
      history.push({ role: 'assistant', content: 'Hello! How can I help you today?' });
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  // ── Send a message ────────────────────────────────────────────────────────

  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    autoResize();

    appendBubble('user', text);
    history.push({ role: 'user', content: text });

    const typing = appendTyping();

    try {
      const res = await fetch('/api/webchat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, messages: history }),
      });

      typing.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        appendBubble('bot', `Sorry, something went wrong: ${err.error || res.statusText}`);
      } else {
        const data = await res.json();
        const reply = data.response || data.reply || '(no response)';
        appendBubble('bot', reply);
        history.push({ role: 'assistant', content: reply });
      }
    } catch (err) {
      typing.remove();
      appendBubble('bot', 'Could not reach the server. Make sure the receptionist is running.');
    }

    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  // ── Reset conversation ────────────────────────────────────────────────────

  document.getElementById('btn-reset').addEventListener('click', () => {
    history = [];
    sessionId = 'test-' + Math.random().toString(36).slice(2);
    messagesEl.innerHTML = '';
    sendBtn.disabled = true;
    init();
  });

  // ── DOM helpers ───────────────────────────────────────────────────────────

  function appendBubble(role, text) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  function appendTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  // ── Input handling ────────────────────────────────────────────────────────

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  inputEl.addEventListener('input', () => {
    autoResize();
    sendBtn.disabled = !inputEl.value.trim() || busy;
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener('click', send);

  // ── Start ─────────────────────────────────────────────────────────────────
  init();
</script>

</body>
</html>
