<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Providers — ChargeWizards Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">⚡</div>
      <div class="sidebar-brand-text">
        <div class="sidebar-brand-name">ChargeWizards</div>
        <div class="sidebar-brand-sub">AI Receptionist</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <a href="#" id="logout-btn">
        <span class="nav-icon">🚪</span>Sign Out
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Provider Profiles</div>
        <div class="page-subtitle">Markdown profiles included in AI context during calls</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary" onclick="reloadProviders()" id="reloadBtn">🔄 Reload from Disk</button>
        <button class="btn btn-primary" onclick="showNewFileForm()">➕ New Profile</button>
      </div>
    </div>

    <div class="page-body">

      <!-- New file form -->
      <div id="newFileForm" class="section hidden" style="margin-bottom:20px">
        <div class="section-header">
          <span class="section-title">Create New Provider Profile</span>
          <button class="btn btn-sm btn-secondary" onclick="hideNewFileForm()">Cancel</button>
        </div>
        <div class="section-body">
          <div class="form-group">
            <label for="newFilename">Filename (e.g., installer-name.md)</label>
            <input type="text" id="newFilename" placeholder="provider-name.md">
          </div>
          <div class="form-group">
            <label for="newContent">Content</label>
            <textarea id="newContent" rows="8" class="font-mono"
              placeholder="# Provider Name&#10;&#10;## About&#10;Brief bio and certifications."></textarea>
          </div>
          <button class="btn btn-success" onclick="createNewFile()">Create File</button>
        </div>
      </div>

      <div id="providersContainer">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="admin.js"></script>
<script>
  const UI = window.AdminUI;
  UI.renderNav('providers.html');
  UI.attachLogout();

  async function loadProviders() {
    const container = document.getElementById('providersContainer');
    try {
      const data = await UI.apiFetch('/admin/api/providers');
      if (!data.files || data.files.length === 0) {
        container.innerHTML = `<div class="empty-state" style="padding:48px">
          <div class="empty-state-icon">👷</div>
          <div class="empty-state-title">No provider profiles yet</div>
          <div class="empty-state-text">Create one to get started</div>
        </div>`;
        return;
      }

      container.innerHTML = data.files.map(file => `
        <div class="prompt-item">
          <div class="prompt-item-header">
            <div>
              <div class="prompt-item-name">${UI.escapeHtml(file.filename)}</div>
              <div class="prompt-item-file">Provider profile</div>
            </div>
            <button class="btn btn-sm btn-success"
                    onclick="saveProvider('${UI.escapeHtml(file.filename)}')"
                    id="save-${UI.escapeHtml(file.filename)}">
              💾 Save
            </button>
          </div>
          <div class="prompt-item-body">
            <textarea
              id="provider-${UI.escapeHtml(file.filename)}"
              data-filename="${UI.escapeHtml(file.filename)}"
              rows="12"
            >${UI.escapeHtml(file.content)}</textarea>
          </div>
        </div>
      `).join('');
    } catch (error) {
      UI.showError(container, 'Failed to load provider profiles: ' + error.message);
    }
  }

  async function saveProvider(filename) {
    const textarea = document.querySelector(`textarea[data-filename="${filename}"]`);
    const btn = document.getElementById(`save-${filename}`);
    const content = textarea.value;
    btn.disabled = true;
    btn.textContent = '⏳ Saving…';
    try {
      await UI.apiFetch(`/admin/api/providers/${filename}`, {
        method: 'PUT',
        body: JSON.stringify({ content })
      });
      UI.Toast.success(`"${filename}" saved`);
    } catch (error) {
      UI.Toast.error('Save failed: ' + error.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '💾 Save';
    }
  }

  async function reloadProviders() {
    const btn = document.getElementById('reloadBtn');
    btn.disabled = true;
    btn.textContent = '⏳ Reloading…';
    try {
      await UI.apiFetch('/admin/api/refresh-providers', { method: 'POST' });
      UI.Toast.success('Provider profiles reloaded');
      await loadProviders();
    } catch (error) {
      UI.Toast.error('Reload failed: ' + error.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '🔄 Reload from Disk';
    }
  }

  function showNewFileForm() {
    document.getElementById('newFileForm').classList.remove('hidden');
    document.getElementById('newFilename').focus();
  }

  function hideNewFileForm() {
    document.getElementById('newFileForm').classList.add('hidden');
    document.getElementById('newFilename').value = '';
    document.getElementById('newContent').value = '';
  }

  async function createNewFile() {
    const filename = document.getElementById('newFilename').value.trim();
    const content = document.getElementById('newContent').value;
    if (!filename) { UI.Toast.error('Please enter a filename'); return; }
    if (!filename.endsWith('.md')) { UI.Toast.error('Filename must end with .md'); return; }
    if (!/^[a-zA-Z0-9-_.]+$/.test(filename)) { UI.Toast.error('Invalid filename'); return; }
    try {
      await UI.apiFetch(`/admin/api/providers/${filename}`, {
        method: 'PUT',
        body: JSON.stringify({ content })
      });
      UI.Toast.success(`"${filename}" created`);
      hideNewFileForm();
      await loadProviders();
    } catch (error) {
      UI.Toast.error('Create failed: ' + error.message);
    }
  }

  window.saveProvider = saveProvider;
  window.reloadProviders = reloadProviders;
  window.showNewFileForm = showNewFileForm;
  window.hideNewFileForm = hideNewFileForm;
  window.createNewFile = createNewFile;

  loadProviders();
</script>
</body>
</html>
