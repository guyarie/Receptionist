<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompts — ChargeWizards Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">⚡</div>
      <div class="sidebar-brand-text">
        <div class="sidebar-brand-name">ChargeWizards</div>
        <div class="sidebar-brand-sub">AI Receptionist</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <a href="#" id="logout-btn">
        <span class="nav-icon">🚪</span>Sign Out
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Prompt Editor</div>
        <div class="page-subtitle">Customize how the AI receptionist behaves and responds</div>
      </div>
    </div>

    <div class="page-body">
      <div id="promptsContainer">
        <div class="loading-center"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="admin.js"></script>
<script>
  const UI = window.AdminUI;
  UI.renderNav('prompts.html');
  UI.attachLogout();

  async function loadPrompts() {
    const container = document.getElementById('promptsContainer');
    try {
      const data = await UI.apiFetch('/admin/api/prompts');
      if (!data.prompts || data.prompts.length === 0) {
        UI.showError(container, 'No prompts found');
        return;
      }

      container.innerHTML = data.prompts.map(prompt => `
        <div class="prompt-item">
          <div class="prompt-item-header">
            <div>
              <div class="prompt-item-name">${UI.escapeHtml(prompt.name)}</div>
              <div class="prompt-item-file">${UI.escapeHtml(prompt.filename)}</div>
            </div>
            <button class="btn btn-sm btn-success"
                    onclick="savePrompt('${UI.escapeHtml(prompt.filename)}')"
                    id="save-${UI.escapeHtml(prompt.filename)}">
              💾 Save
            </button>
          </div>
          <div class="prompt-item-body">
            <textarea
              id="prompt-${UI.escapeHtml(prompt.filename)}"
              data-filename="${UI.escapeHtml(prompt.filename)}"
              rows="12"
            >${UI.escapeHtml(prompt.content)}</textarea>
          </div>
        </div>
      `).join('');
    } catch (error) {
      UI.showError(container, 'Failed to load prompts: ' + error.message);
      UI.Toast.error('Failed to load prompts: ' + error.message);
    }
  }

  async function savePrompt(filename) {
    const textarea = document.querySelector(`textarea[data-filename="${filename}"]`);
    const btn = document.getElementById(`save-${filename}`);
    const content = textarea.value;

    if (!content || content.trim().length === 0) {
      UI.Toast.error('Prompt content cannot be empty');
      return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ Saving…';
    try {
      await UI.apiFetch(`/admin/api/prompts/${filename}`, {
        method: 'PUT',
        body: JSON.stringify({ content })
      });
      UI.Toast.success(`"${filename}" saved`);
    } catch (error) {
      UI.Toast.error('Save failed: ' + error.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '💾 Save';
    }
  }

  window.savePrompt = savePrompt;
  loadPrompts();
</script>
</body>
</html>
