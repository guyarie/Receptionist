<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call Logs - AI Phone Receptionist</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>📞 Call Logs</h1>
    </div>
  </header>

  <nav>
    <div class="container">
      <ul></ul>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="margin-bottom: 0;">Call History</h2>
        <button id="deleteAllBtn" class="btn btn-danger btn-sm" onclick="deleteAllCalls()">🗑️ Delete All</button>
      </div>
      <div id="callsContainer">
        <div class="spinner"></div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    const UI = window.AdminUI;

    // Set active nav
    UI.renderNav('calls.html');

    let currentPage = 1;
    const pageSize = 20;

    // Load calls
    async function loadCalls(page = 1) {
      const container = document.getElementById('callsContainer');
      container.innerHTML = '<div class="spinner"></div>';
      
      try {
        const data = await UI.apiFetch(`/admin/api/calls?page=${page}&limit=${pageSize}`);
        
        if (!data.calls || data.calls.length === 0) {
          UI.showError(container, 'No call logs found');
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        currentPage = page;

        // Render calls table
        container.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Date & Time</th>
                <th>Caller Phone</th>
                <th>Duration</th>
                <th>Summary</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${data.calls.map(call => `
                <tr>
                  <td>${UI.formatTimestamp(call.startTime)}</td>
                  <td>${UI.escapeHtml(call.callerPhone)}</td>
                  <td>${UI.escapeHtml(call.duration)}</td>
                  <td>
                    <div style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                      ${UI.escapeHtml(call.summary || 'No summary available')}
                    </div>
                  </td>
                  <td>
                    <span class="expand-toggle" onclick="toggleTranscript('${UI.escapeHtml(call.id)}')">
                      View Details
                    </span>
                    <button class="btn btn-danger btn-sm" style="margin-left: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.8rem;" onclick="deleteSingleCall('${UI.escapeHtml(call.id)}', this)" title="Delete this call log">🗑️</button>
                  </td>
                </tr>
                <tr id="transcript-${UI.escapeHtml(call.id)}" class="hidden">
                  <td colspan="5">
                    <div class="expandable" id="content-${UI.escapeHtml(call.id)}">
                      <div class="spinner"></div>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;

        // Render pagination
        renderPagination(data.page, data.totalPages);
      } catch (error) {
        UI.showError(container, 'Failed to load call logs: ' + error.message);
        UI.Toast.error('Failed to load call logs: ' + error.message);
      }
    }

    // Toggle transcript display
    async function toggleTranscript(callId) {
      const row = document.getElementById(`transcript-${callId}`);
      const content = document.getElementById(`content-${callId}`);
      
      if (row.classList.contains('hidden')) {
        row.classList.remove('hidden');
        content.classList.add('open');
        
        // Load full call details if not already loaded
        if (content.innerHTML.includes('spinner')) {
          try {
            const call = await UI.apiFetch(`/admin/api/calls/${callId}`);
            content.innerHTML = `
              <h3>Call Details</h3>
              <p><strong>Call SID:</strong> ${UI.escapeHtml(call.callSid)}</p>
              <p><strong>Caller:</strong> ${UI.escapeHtml(call.callerPhone)}</p>
              <p><strong>Twilio Number:</strong> ${UI.escapeHtml(call.twilioNumber || 'N/A')}</p>
              <p><strong>Start Time:</strong> ${UI.formatTimestamp(call.startTime)}</p>
              <p><strong>End Time:</strong> ${UI.formatTimestamp(call.endTime)}</p>
              <p><strong>Duration:</strong> ${UI.escapeHtml(call.duration)}</p>
              
              <h3 style="margin-top: 1rem;">Summary</h3>
              <p>${UI.escapeHtml(call.summary || 'No summary available')}</p>
              
              ${call.notificationDecision ? `
              <h3 style="margin-top: 1rem;">Notification Decision</h3>
              <p>${UI.escapeHtml(call.notificationDecision)}</p>
              ` : ''}
              
              <h3 style="margin-top: 1rem;">Full Transcript</h3>
              <div style="background: white; padding: 1rem; border-radius: 4px; max-height: 400px; overflow-y: auto;">
                ${call.fullTranscript && call.fullTranscript.length > 0
                  ? call.fullTranscript.map(msg => `
                      <p style="margin-bottom: 0.5rem;">
                        <strong>${UI.escapeHtml(msg.speaker)}:</strong>
                        ${UI.escapeHtml(msg.message)}
                      </p>
                    `).join('')
                  : '<p class="text-muted">No transcript available</p>'
                }
              </div>
            `;
          } catch (error) {
            content.innerHTML = `<p class="text-muted">Failed to load call details: ${UI.escapeHtml(error.message)}</p>`;
          }
        }
      } else {
        row.classList.add('hidden');
        content.classList.remove('open');
      }
    }

    // Render pagination controls
    function renderPagination(currentPage, totalPages) {
      const pagination = document.getElementById('pagination');
      
      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }

      let buttons = [];
      
      // Previous button
      if (currentPage > 1) {
        buttons.push(`<button onclick="loadCalls(${currentPage - 1})">← Previous</button>`);
      }

      // Page numbers
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          const active = i === currentPage ? 'active' : '';
          buttons.push(`<button class="${active}" onclick="loadCalls(${i})">${i}</button>`);
        } else if (i === currentPage - 3 || i === currentPage + 3) {
          buttons.push(`<span style="padding: 0.5rem;">...</span>`);
        }
      }

      // Next button
      if (currentPage < totalPages) {
        buttons.push(`<button onclick="loadCalls(${currentPage + 1})">Next →</button>`);
      }

      pagination.innerHTML = buttons.join('');
    }

    // Delete a single call log
    async function deleteSingleCall(callId, buttonEl) {
      if (!confirm('Are you sure you want to delete this call log? This action cannot be undone.')) {
        return;
      }

      try {
        await UI.apiFetch(`/admin/api/calls/${encodeURIComponent(callId)}`, { method: 'DELETE' });

        // Remove the call row and its transcript row from the DOM
        const transcriptRow = document.getElementById(`transcript-${callId}`);
        if (transcriptRow) {
          transcriptRow.previousElementSibling.remove();
          transcriptRow.remove();
        } else {
          // Fallback: walk up from the button to the <tr>
          const row = buttonEl.closest('tr');
          if (row) row.remove();
        }

        UI.Toast.success('Call log deleted successfully');
      } catch (error) {
        UI.Toast.error('Failed to delete call log: ' + error.message);
      }
    }

    // Delete all call logs
    async function deleteAllCalls() {
      if (!confirm('Are you sure you want to delete ALL call logs? This action cannot be undone.')) {
        return;
      }

      const deleteAllBtn = document.getElementById('deleteAllBtn');
      deleteAllBtn.disabled = true;

      try {
        const data = await UI.apiFetch('/admin/api/calls', { method: 'DELETE' });
        UI.Toast.success(`Deleted ${data.deletedCount} call log(s)`);
        loadCalls(1);
      } catch (error) {
        UI.Toast.error('Failed to delete call logs: ' + error.message);
      } finally {
        deleteAllBtn.disabled = false;
      }
    }

    // Make functions available globally
    window.toggleTranscript = toggleTranscript;
    window.loadCalls = loadCalls;
    window.deleteSingleCall = deleteSingleCall;
    window.deleteAllCalls = deleteAllCalls;

    // Load calls on page load
    loadCalls(1);
  </script>
</body>
</html>
