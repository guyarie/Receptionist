<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call Logs — ChargeWizards Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="/logo.png" alt="ChargeWizards" style="height:32px;width:auto;">
      <div class="sidebar-brand-text">
        <div class="sidebar-brand-name">ChargeWizards</div>
        <div class="sidebar-brand-sub">AI Receptionist</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <a href="#" id="logout-btn">
        <span class="nav-icon">🚪</span>Sign Out
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content" style="overflow:hidden; display:flex; flex-direction:column;">
    <div class="page-header">
      <div>
        <div class="page-title">Call Logs</div>
        <div class="page-subtitle">Phone call transcripts and summaries</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary btn-sm" onclick="loadCalls(currentPage)">🔄 Refresh</button>
      </div>
    </div>

    <!-- Folder layout -->
    <div class="folder-layout">

      <!-- Call list -->
      <div class="folder-list">
        <div class="folder-list-header">
          <input class="folder-search" id="callSearch" type="text"
                 placeholder="Search by phone or summary…" oninput="filterCalls()">
        </div>
        <div class="list-count" id="callCount">Loading…</div>
        <div class="folder-items" id="callList">
          <div class="loading-center"><div class="spinner"></div></div>
        </div>
        <div class="pagination" id="pagination" style="padding:12px 8px;border-top:1px solid var(--gray-200)"></div>
      </div>

      <!-- Call detail -->
      <div class="folder-detail" id="callDetail">
        <div class="empty-state">
          <div class="empty-state-icon">📞</div>
          <div class="empty-state-title">Select a call</div>
          <div class="empty-state-text">Click a call from the list to view its transcript</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="admin.js"></script>
<script>
const UI = window.AdminUI;
UI.renderNav('calls.html');
UI.attachLogout();

let allCalls = [];
let currentPage = 1;
const PAGE_SIZE = 30;
let currentCallId = null;

// ── Load calls ───────────────────────────────────────────────
async function loadCalls(page = 1) {
  const listEl = document.getElementById('callList');
  listEl.innerHTML = '<div class="loading-center"><div class="spinner"></div></div>';
  document.getElementById('callCount').textContent = 'Loading…';

  try {
    const data = await UI.apiFetch(`/admin/api/calls?page=${page}&limit=${PAGE_SIZE}`);
    allCalls = data.calls || [];
    currentPage = data.page || page;
    renderList();
    renderPagination(data.page, data.totalPages);
  } catch (err) {
    listEl.innerHTML = `<p class="text-muted text-center" style="padding:24px">Failed to load calls</p>`;
  }
}

function filterCalls() { renderList(); }

function renderList() {
  const query = (document.getElementById('callSearch').value || '').toLowerCase();
  const filtered = allCalls.filter(call =>
    !query ||
    (call.callerPhone || '').includes(query) ||
    (call.summary || '').toLowerCase().includes(query)
  );

  document.getElementById('callCount').textContent =
    `${filtered.length} call${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    document.getElementById('callList').innerHTML =
      `<div class="empty-state" style="padding:40px 20px">
        <div class="empty-state-icon">🔍</div>
        <div class="empty-state-title">No calls found</div>
      </div>`;
    return;
  }

  document.getElementById('callList').innerHTML = filtered.map(call => {
    const isActive = call.id === currentCallId ? 'active' : '';
    const summary = (call.summary || 'No summary').substring(0, 80);
    return `<div class="folder-item ${isActive}" onclick="selectCall('${UI.escapeHtml(call.id)}')"
             id="call-item-${UI.escapeHtml(call.id)}">
      <div class="folder-item-name">
        <span>${UI.escapeHtml(call.callerPhone || 'Unknown')}</span>
        <span class="text-sm text-muted">${UI.escapeHtml(call.duration || '')}</span>
      </div>
      <div class="folder-item-meta">
        <span>${UI.formatDate(call.startTime)}</span>
      </div>
      <div class="folder-item-preview">${UI.escapeHtml(summary)}</div>
    </div>`;
  }).join('');
}

// ── Select call ──────────────────────────────────────────────
async function selectCall(callId) {
  currentCallId = callId;

  document.querySelectorAll('[id^="call-item-"]').forEach(el =>
    el.classList.toggle('active', el.id === `call-item-${callId}`)
  );

  const detail = document.getElementById('callDetail');
  detail.innerHTML = `<div class="folder-detail-header">
    <div>
      <div class="folder-detail-name" id="detailPhone">Loading…</div>
      <div class="folder-detail-meta" id="detailMeta"></div>
    </div>
  </div>
  <div class="folder-detail-body" id="callBody">
    <div class="loading-center"><div class="spinner"></div></div>
  </div>`;

  try {
    const call = await UI.apiFetch(`/admin/api/calls/${encodeURIComponent(callId)}`);
    document.getElementById('detailPhone').textContent = call.callerPhone || 'Unknown';
    document.getElementById('detailMeta').innerHTML = `
      <span class="detail-meta-item">📅 ${UI.formatTimestamp(call.startTime)}</span>
      <span class="detail-meta-item">⏱ ${UI.escapeHtml(call.duration || '—')}</span>
      ${call.twilioNumber ? `<span class="detail-meta-item">📱 ${UI.escapeHtml(call.twilioNumber)}</span>` : ''}
    `;

    const body = document.getElementById('callBody');

    // Summary
    let html = '';
    if (call.summary) {
      html += `<div class="section" style="margin-bottom:20px">
        <div class="section-header"><span class="section-title">Summary</span></div>
        <div class="section-body" style="font-size:13.5px;line-height:1.6">${UI.escapeHtml(call.summary)}</div>
      </div>`;
    }

    // Transcript as chat bubbles
    if (call.fullTranscript && call.fullTranscript.length > 0) {
      html += `<div class="section">
        <div class="section-header"><span class="section-title">Transcript</span></div>
        <div class="section-body">
          <div class="chat-thread">
            ${call.fullTranscript.map(msg => {
              const isCaller = (msg.speaker || '').toLowerCase().includes('caller') ||
                               (msg.speaker || '').toLowerCase().includes('user') ||
                               (msg.speaker || '').toLowerCase().includes('customer');
              const cls = isCaller ? 'user' : 'assistant';
              return `<div class="chat-msg ${cls}">
                <span class="chat-speaker">${UI.escapeHtml(msg.speaker || (isCaller ? 'Caller' : 'AI'))}</span>
                <div class="chat-bubble">${UI.escapeHtml(msg.message || msg.content || '')}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>`;
    } else {
      html += `<div class="empty-state">
        <div class="empty-state-icon">📄</div>
        <div class="empty-state-title">No transcript available</div>
      </div>`;
    }

    body.innerHTML = html;
  } catch (err) {
    document.getElementById('callBody').innerHTML =
      `<p class="text-muted text-center" style="padding:24px">Failed to load call details</p>`;
  }
}

// ── Pagination ───────────────────────────────────────────────
function renderPagination(page, totalPages) {
  const el = document.getElementById('pagination');
  if (!totalPages || totalPages <= 1) { el.innerHTML = ''; return; }

  let buttons = [];
  if (page > 1) buttons.push(`<button class="btn btn-sm btn-secondary" onclick="loadCalls(${page-1})">← Prev</button>`);

  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= page - 1 && i <= page + 1)) {
      const active = i === page ? 'active' : '';
      buttons.push(`<button class="btn btn-sm btn-secondary ${active}" onclick="loadCalls(${i})">${i}</button>`);
    } else if (i === page - 2 || i === page + 2) {
      buttons.push(`<span style="padding:0 4px;color:var(--gray-400)">…</span>`);
    }
  }

  if (page < totalPages) buttons.push(`<button class="btn btn-sm btn-secondary" onclick="loadCalls(${page+1})">Next →</button>`);
  el.innerHTML = buttons.join('');
}

loadCalls(1);
</script>
</body>
</html>
