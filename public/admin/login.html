<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — ChargeWizards</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="/logo.png" alt="ChargeWizards" style="height:50px;width:auto;margin-bottom:8px;">
      <div class="login-sub">AI Receptionist Admin</div>
    </div>

    <div id="error-message" class="login-error"></div>

    <form method="POST" action="/admin/login">
      <input type="hidden" name="csrf_token" value="">

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autofocus
               placeholder="Enter admin password" style="font-size:14px;">
      </div>

      <button type="submit" class="btn btn-primary w-full" style="width:100%; padding:11px; font-size:14px; justify-content:center;">
        Sign In
      </button>
    </form>
  </div>

  <script>
    // Show error if present in URL
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      const el = document.getElementById('error-message');
      el.textContent = 'Incorrect password. Please try again.';
      el.classList.add('show');
    }
  </script>
</body>
</html>
