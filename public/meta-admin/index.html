<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --border: #e2e5ea;
      --text: #1a1d23;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-light: #eef2ff;
      --green: #16a34a;
      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;
      --amber: #b45309;
      --amber-bg: #fffbeb;
      --amber-border: #fde68a;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --red-border: #fecaca;
      --gray: #6b7280;
      --gray-bg: #f9fafb;
      --gray-border: #e5e7eb;
      --user-bubble: #4f46e5;
      --assistant-bubble: #f1f3f5;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-icon {
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 16px; flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 700; }
    header p { font-size: 12px; color: var(--muted); }
    .header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .btn-ghost {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--muted);
      transition: all .15s;
    }
    .btn-ghost:hover { background: var(--bg); color: var(--text); border-color: #c4c9d4; }

    /* ── Main layout ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── Install panel ── */
    .installs-panel {
      padding: 16px 0 12px;
      flex-shrink: 0;
    }
    .panel-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .panel-header h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .panel-header .refresh-btn {
      background: none; border: none; cursor: pointer; color: var(--muted); font-size: 14px;
      padding: 2px 6px; border-radius: 6px; transition: all .15s; line-height: 1;
    }
    .panel-header .refresh-btn:hover { background: var(--gray-bg); color: var(--text); }
    .panel-header .refresh-btn.spinning { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .install-grid {
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .install-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      min-width: 180px;
      flex: 1;
      max-width: 260px;
      cursor: default;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .card-name { font-size: 15px; font-weight: 700; }
    .card-biz { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .card-port { font-size: 11px; color: var(--muted); }
    .status-badge {
      font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    }
    .status-online { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .status-setup  { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
    .status-stopped{ background: var(--gray-bg);  color: var(--gray);  border: 1px solid var(--gray-border); }
    .status-errored { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
    .card-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .card-link {
      font-size: 12px; font-weight: 500; color: var(--accent); text-decoration: none;
      padding: 3px 8px; border: 1px solid #c7d2fe; border-radius: 6px; background: var(--accent-light);
      transition: all .15s; white-space: nowrap;
    }
    .card-link:hover { background: #e0e7ff; border-color: #a5b4fc; }
    .card-action-btn {
      font-size: 11px; color: var(--muted); background: none; border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 8px; cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .card-action-btn:hover { background: var(--bg); color: var(--text); }
    .install-empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
    .install-loading { color: var(--muted); font-size: 13px; padding: 12px 0; font-style: italic; }

    /* ── Chat panel ── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-top: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      overflow: hidden;
    }

    .messages {
      flex: 1; overflow-y: auto; padding: 20px 20px 12px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .welcome {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 32px 24px; gap: 12px;
    }
    .welcome-icon { font-size: 36px; margin-bottom: 4px; }
    .welcome h2 { font-size: 18px; font-weight: 700; }
    .welcome p { font-size: 14px; color: var(--muted); max-width: 420px; line-height: 1.6; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
    .chip {
      font-size: 13px; padding: 6px 14px; border: 1px solid var(--border);
      border-radius: 20px; background: var(--bg); cursor: pointer;
      transition: all .15s; color: var(--text);
    }
    .chip:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

    .message { display: flex; gap: 10px; align-items: flex-start; animation: fadeIn .2s ease; }
    .message.user { flex-direction: row-reverse; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;
    }
    .avatar.assistant { background: var(--accent-light); color: var(--accent); }
    .avatar.user { background: var(--user-bubble); color: white; }
    .bubble {
      max-width: 78%; padding: 11px 15px; border-radius: var(--radius);
      font-size: 14px; line-height: 1.65;
    }
    .message.assistant .bubble { background: var(--assistant-bubble); border-bottom-left-radius: 4px; }
    .message.user .bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 8px 0 8px 20px; }
    .bubble li { margin-bottom: 3px; }
    .bubble strong { font-weight: 600; }
    .bubble code {
      background: rgba(0,0,0,.08); padding: 2px 5px; border-radius: 4px;
      font-family: monospace; font-size: 12px;
    }
    .bubble pre { background: rgba(0,0,0,.06); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
    .bubble pre code { background: none; padding: 0; font-size: 12px; line-height: 1.5; }
    .message.user .bubble code { background: rgba(255,255,255,.2); }

    /* Activity (tool calls) */
    .activity {
      margin: 0 40px;
      background: var(--gray-bg); border: 1px solid var(--gray-border);
      border-radius: var(--radius-sm); overflow: hidden; animation: fadeIn .15s ease;
    }
    .activity-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; cursor: pointer; user-select: none; font-size: 12px;
    }
    .activity-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .activity-dot.pulsing { animation: pulse 1s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .activity-label { flex: 1; color: var(--muted); }
    .activity-toggle { color: var(--muted); font-size: 10px; }
    .activity-body { padding: 0 12px 10px; font-size: 12px; color: var(--muted); font-family: monospace; white-space: pre-wrap; word-break: break-word; }
    .activity-body.hidden { display: none; }

    /* Typing indicator */
    .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; align-items: center; }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce .8s ease infinite; }
    .typing-dot:nth-child(2) { animation-delay: .15s; }
    .typing-dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

    /* Input area */
    .input-area {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-end;
    }
    .input-wrapper { flex: 1; position: relative; }
    textarea {
      width: 100%; resize: none; border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none;
      transition: border-color .15s; max-height: 160px; overflow-y: auto; line-height: 1.5;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    .send-btn {
      flex-shrink: 0; padding: 10px 18px; background: var(--accent); color: white;
      border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background .15s;
    }
    .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .send-btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <div class="header-icon">⚙</div>
  <div>
    <h1>Meta Admin</h1>
    <p>AI Receptionist — Install Manager</p>
  </div>
  <div class="header-actions">
    <form method="POST" action="/logout">
      <button type="submit" class="btn-ghost">Sign out</button>
    </form>
  </div>
</header>

<div class="main">
  <!-- Install status -->
  <div class="installs-panel">
    <div class="panel-header">
      <h2>Installs</h2>
      <button class="refresh-btn" id="refresh-btn" onclick="loadInstalls()" title="Refresh">↻</button>
    </div>
    <div id="install-grid" class="install-grid">
      <p class="install-loading">Loading…</p>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🤖</div>
        <h2>Admin Agent</h2>
        <p>Ask me to start, stop, restart, or create installs. I can also pull logs and configure nginx.</p>
        <div class="chips">
          <button class="chip" onclick="suggest('List all installs')">List all installs</button>
          <button class="chip" onclick="suggest('Start all stopped installs')">Start all</button>
          <button class="chip" onclick="suggest('Stop all running installs')">Stop all</button>
          <button class="chip" onclick="suggest('Show nginx config for all installs')">Nginx config</button>
        </div>
      </div>
    </div>
    <div class="input-area">
      <textarea id="input" placeholder="Ask anything…" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
  // ── Session ──────────────────────────────────────────────────────────────────
  const sessionId = Math.random().toString(36).slice(2);

  // ── Install cards ────────────────────────────────────────────────────────────
  async function loadInstalls() {
    const grid = document.getElementById('install-grid');
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    try {
      const res = await fetch('/api/installs');
      if (!res.ok) throw new Error(res.statusText);
      const installs = await res.json();
      renderInstalls(installs);
    } catch (e) {
      grid.innerHTML = `<p class="install-empty">Could not load install status: ${e.message}</p>`;
    } finally {
      btn.classList.remove('spinning');
    }
  }

  function renderInstalls(installs) {
    const grid = document.getElementById('install-grid');
    if (!installs.length) {
      grid.innerHTML = '<p class="install-empty">No installs found. Ask the agent to create one.</p>';
      return;
    }
    grid.innerHTML = installs.map(inst => {
      const { name, port, setupPort, inSetup, status, businessName, publicUrl } = inst;
      const isOnline = status === 'online';
      const badgeClass = isOnline
        ? (inSetup ? 'status-setup' : 'status-online')
        : (status === 'errored' ? 'status-errored' : 'status-stopped');
      const badgeText = isOnline
        ? (inSetup ? 'Setup mode' : 'Running')
        : (status === 'errored' ? 'Errored' : 'Stopped');

      const adminUrl = inSetup
        ? `http://localhost:${setupPort}/setup`
        : `http://localhost:${port}/admin`;
      const adminLabel = inSetup ? 'Open Setup' : 'Open Admin';

      const publicLink = publicUrl
        ? `<a class="card-link" href="${publicUrl}" target="_blank" rel="noreferrer">Public site ↗</a>`
        : '';

      return `<div class="install-card">
        <div class="card-top">
          <div class="card-name">${esc(name)}</div>
          <span class="status-badge ${badgeClass}">${badgeText}</span>
        </div>
        ${businessName ? `<div class="card-biz">${esc(businessName)}</div>` : ''}
        <div class="card-port">port ${port}${inSetup ? ` · setup ${setupPort}` : ''}</div>
        <div class="card-actions">
          <a class="card-link" href="${adminUrl}" target="_blank" rel="noreferrer">${adminLabel} ↗</a>
          ${publicLink}
          ${isOnline
            ? `<button class="card-action-btn" onclick="suggest('Restart the ${esc(name)} install')">Restart</button>
               <button class="card-action-btn" onclick="suggest('Stop the ${esc(name)} install')">Stop</button>`
            : `<button class="card-action-btn" onclick="suggest('Start the ${esc(name)} install')">Start</button>`
          }
          <button class="card-action-btn" onclick="suggest('Show the last 50 log lines for ${esc(name)}')">Logs</button>
        </div>
      </div>`;
    }).join('');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Chat ──────────────────────────────────────────────────────────────────────
  let busy = false;

  function suggest(text) {
    document.getElementById('input').value = text;
    autoResize(document.getElementById('input'));
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  async function sendMessage() {
    if (busy) return;
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    autoResize(input);
    hideWelcome();
    appendMessage('user', text);
    setLoading(true);

    // SSE stream
    let activityEl = null;
    let currentActivity = {};
    let assistantBubble = null;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId }),
      });

      if (!res.ok) {
        const { error } = await res.json().catch(() => ({ error: res.statusText }));
        appendMessage('assistant', `Error: ${error}`);
        return;
      }

      // Read SSE stream
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data:')) continue;
          let evt;
          try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }
          handleEvent(evt);
        }
      }
    } catch (err) {
      appendMessage('assistant', `Connection error: ${err.message}`);
    } finally {
      setLoading(false);
      // Refresh install cards after any agent interaction (give PM2 2s to settle)
      setTimeout(loadInstalls, 2000);
    }

    function handleEvent(evt) {
      if (evt.type === 'tool_start') {
        activityEl = appendActivity(evt.label || evt.name, true);
        currentActivity = evt;
      } else if (evt.type === 'tool_end') {
        if (activityEl) finalizeActivity(activityEl, evt.summary || '');
        activityEl = null;
      } else if (evt.type === 'message') {
        appendMessage('assistant', evt.content);
      } else if (evt.type === 'error') {
        appendMessage('assistant', `Error: ${evt.message}`);
      }
      // 'done' — nothing to do, finally block handles cleanup
    }
  }

  function hideWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function setLoading(on) {
    busy = on;
    document.getElementById('send-btn').disabled = on;
    const input = document.getElementById('input');
    input.disabled = on;

    const existing = document.getElementById('typing-indicator');
    if (on && !existing) {
      const el = document.createElement('div');
      el.id = 'typing-indicator';
      el.className = 'message assistant';
      el.innerHTML = `
        <div class="avatar assistant">🤖</div>
        <div class="bubble">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>`;
      scrollToBottom(el);
    } else if (!on && existing) {
      existing.remove();
      if (!busy) input.focus();
    }
  }

  function appendMessage(role, content) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = `message ${role}`;
    const avatar = role === 'user' ? 'U' : '🤖';
    el.innerHTML = `
      <div class="avatar ${role}">${avatar}</div>
      <div class="bubble">${renderMarkdown(content)}</div>`;
    scrollToBottom(el);
    return el;
  }

  function appendActivity(label, pulsing) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'activity';
    el.innerHTML = `
      <div class="activity-header" onclick="toggleActivity(this)">
        <div class="activity-dot${pulsing ? ' pulsing' : ''}"></div>
        <span class="activity-label">${esc(label)}</span>
        <span class="activity-toggle">▾</span>
      </div>
      <div class="activity-body hidden"></div>`;
    scrollToBottom(el);
    return el;
  }

  function finalizeActivity(el, summary) {
    const dot = el.querySelector('.activity-dot');
    dot.classList.remove('pulsing');
    dot.style.background = '#16a34a';
    if (summary) {
      const body = el.querySelector('.activity-body');
      body.textContent = summary;
    }
  }

  function toggleActivity(header) {
    const body = header.nextElementSibling;
    const toggle = header.querySelector('.activity-toggle');
    body.classList.toggle('hidden');
    toggle.textContent = body.classList.contains('hidden') ? '▾' : '▴';
  }

  function scrollToBottom(el) {
    const msgs = document.getElementById('messages');
    const indicator = document.getElementById('typing-indicator');
    if (indicator) msgs.insertBefore(el, indicator);
    else msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
  }

  // Simple markdown renderer (bold, italic, code, pre, headings, lists, links)
  function renderMarkdown(text) {
    if (!text) return '';
    let html = esc(text);
    // Code blocks (must come before inline code)
    html = html.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
      `<pre><code>${code.trim()}</code></pre>`);
    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Headings
    html = html.replace(/^### (.+)$/gm, '<strong>$1</strong>');
    html = html.replace(/^## (.+)$/gm, '<strong>$1</strong>');
    html = html.replace(/^# (.+)$/gm, '<strong>$1</strong>');
    // Unordered lists
    html = html.replace(/^[-•] (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, s => `<ul>${s}</ul>`);
    // Numbered lists
    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    // Paragraphs (double newlines)
    html = html.split('\n\n').map(p => {
      if (p.startsWith('<ul>') || p.startsWith('<pre>') || p.startsWith('<li>')) return p;
      return `<p>${p.replace(/\n/g, '<br>')}</p>`;
    }).join('\n');
    return html;
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  loadInstalls();
  document.getElementById('input').focus();
</script>
</body>
</html>
