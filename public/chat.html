<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChargeWizards — Chat with David</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue: #1a73e8;
      --blue-light: #e8f0fe;
      --gray-50: #fafafa;
      --gray-100: #f5f5f7;
      --gray-200: #e8e8ed;
      --gray-400: #a1a1a6;
      --gray-500: #86868b;
      --gray-700: #424245;
      --gray-900: #1d1d1f;
      --radius: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: var(--gray-100);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Brand Bar */
    .brand-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 440px;
      padding: 0 4px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-900);
      letter-spacing: -0.2px;
    }

    .brand-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--gray-500);
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 0 2px rgba(52,199,89,0.2);
    }

    /* Chat Container */
    .chat-container {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      height: 80vh;
      height: 80dvh;
      max-height: 700px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 0.5px solid var(--gray-200);
    }

    /* Header */
    .chat-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: white;
      border-bottom: 0.5px solid var(--gray-200);
    }

    .avatar {
      height: 36px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar img {
      height: 100%;
      width: auto;
      object-fit: contain;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--gray-900);
      letter-spacing: -0.3px;
    }

    .header-text p {
      font-size: 12px;
      color: var(--gray-500);
      margin-top: 1px;
      font-weight: 500;
    }

    /* Messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: var(--gray-50);
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 0; }

    .message {
      margin-bottom: 10px;
      display: flex;
      align-items: flex-end;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { justify-content: flex-end; }

    .msg-avatar { display: none; }

    .message.user .msg-avatar { display: none; }

    .message-content {
      max-width: 78%;
      padding: 10px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 14px;
      letter-spacing: -0.1px;
    }

    .message.ai .message-content {
      background: white;
      color: var(--gray-900);
      border-bottom-left-radius: 6px;
      box-shadow: var(--shadow-sm);
      border: 0.5px solid var(--gray-200);
    }

    .message.user .message-content {
      background: var(--blue);
      color: white;
      border-bottom-right-radius: 6px;
    }

    /* Suggestions */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      padding: 12px 4px;
      border-top: 0.5px solid var(--gray-200);
    }

    .suggestion-btn {
      background: white;
      border: 1px solid var(--gray-200);
      color: var(--gray-700);
      padding: 9px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
      font-family: inherit;
      letter-spacing: -0.1px;
    }

    .suggestion-btn:hover {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
      transform: scale(1.02);
    }

    .suggestion-btn:active {
      transform: scale(0.98);
    }

    /* Input Area */
    .chat-input-container {
      padding: 14px 16px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: white;
      border-top: 0.5px solid var(--gray-200);
    }

    .chat-input-form {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--gray-100);
      border-radius: 24px;
      padding: 4px 4px 4px 6px;
      border: 1px solid transparent;
      transition: border-color 0.2s, background 0.2s;
    }

    .chat-input-form:focus-within {
      background: white;
      border-color: var(--gray-200);
      box-shadow: 0 0 0 3px rgba(26,115,232,0.08);
    }

    .chat-input {
      flex: 1;
      padding: 10px 12px;
      border: none;
      background: transparent;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      color: var(--gray-900);
      letter-spacing: -0.1px;
    }

    .chat-input::placeholder { color: var(--gray-400); }

    .chat-send-btn {
      background: var(--blue);
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-send-btn:hover { background: #0d5bba; transform: scale(1.05); }
    .chat-send-btn:active { transform: scale(0.95); }
    .chat-send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* Photo */
    .photo-btn {
      font-size: 18px;
      cursor: pointer;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      border-radius: 50%;
      transition: all 0.15s;
      color: var(--gray-500);
    }
    .photo-btn:hover { color: var(--blue); }

    .upload-preview { display: flex; gap: 8px; padding: 0 8px 8px; flex-wrap: wrap; }
    .upload-preview:empty { display: none; }
    .preview-item { position: relative; width: 56px; height: 56px; border-radius: 10px; overflow: hidden; border: 1px solid var(--gray-200); }
    .preview-item img, .preview-item video { width: 100%; height: 100%; object-fit: cover; }
    .preview-remove { position: absolute; top: -3px; right: -3px; background: var(--gray-700); color: white; border: 2px solid white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .message-images { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .message-images img { max-width: 140px; max-height: 110px; border-radius: 10px; cursor: pointer; }

    /* Typing */
    .typing-indicator { display: none; padding: 10px 16px; background: white; border-radius: 18px; border-bottom-left-radius: 6px; box-shadow: var(--shadow-sm); border: 0.5px solid var(--gray-200); }
    .typing-indicator.active { display: inline-block; }
    .typing-text { display: none; }

    .typing-indicator span {
      height: 6px; width: 6px; background: var(--gray-400); border-radius: 50%;
      display: inline-block; margin-right: 3px; animation: typing 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.3s; margin-right: 0; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* Footer */
    .powered-by {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      color: var(--gray-400);
      font-weight: 500;
      letter-spacing: -0.1px;
    }
    .powered-by a { color: var(--gray-500); text-decoration: none; }
    .powered-by a:hover { color: var(--blue); }

    /* Mobile */
    @media(max-width: 480px) {
      body { padding: 0; background: white; }
      .brand-bar { display: none; }
      .chat-container {
        border-radius: 0;
        max-width: 100%;
        height: 100vh;
        height: 100dvh;
        max-height: none;
        border: none;
        box-shadow: none;
      }
      .chat-header { padding: 16px 20px; }
      .powered-by { display: none; }
    }
  </style>
</head>
<body>
  <div class="brand-bar">
    <img class="brand-logo" src="/logo.png" alt="CW" onerror="this.style.display='none'">
    <span class="brand-name">ChargeWizards</span>
    <span class="brand-status"><span class="status-dot"></span> Online</span>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar"><img src="/logo.png" alt="CW"></div>
      <div class="header-text">
        <h1>David</h1>
        <p>EV Charging Specialist</p>
      </div>
    </div>

    <div class="chat-messages" id="messages">
      <!-- Greeting loads here first, then suggestions appear below -->
      <div class="suggestions" id="suggestions" style="display:none">
        <button class="suggestion-btn" onclick="sendSuggestion('I want to install an EV charger')">I want to install an EV charger</button>
        <button class="suggestion-btn" onclick="sendSuggestion('I live in a condo, can I even install an EV charger?')">I live in a condo, can I even install an EV charger?</button>
        <button class="suggestion-btn" onclick="sendSuggestion('Do I need a panel upgrade?')">Do I need a panel upgrade?</button>
        <button class="suggestion-btn" onclick="sendSuggestion('How much does it cost?')">How much does it cost?</button>
      </div>
    </div>

    <div class="chat-input-container">
      <div class="upload-preview" id="uploadPreview"></div>
      <form class="chat-input-form" id="chatForm">
        <label class="photo-btn" title="Share photos">
          <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none">
          📷
        </label>
        <input type="text" class="chat-input" id="messageInput" placeholder="Message David..." autocomplete="off">
        <button type="submit" class="chat-send-btn" id="sendBtn">↑</button>
      </form>
    </div>
    <div class="powered-by"><a href="https://www.chargewizards.com" target="_blank">chargewizards.com</a> · (650) 542-8877</div>
  </div>

  <script>
    const messagesContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    let sessionId = 'web-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
    let pendingFiles = [];
    const fileInput = document.getElementById('fileInput');
    const uploadPreview = document.getElementById('uploadPreview');

    fileInput.addEventListener('change', (e) => {
      for (const file of e.target.files) {
        if (pendingFiles.length >= 5) break;
        pendingFiles.push(file);
        const item = document.createElement('div');
        item.className = 'preview-item';
        if (file.type.startsWith('video/')) {
          const vid = document.createElement('video'); vid.src = URL.createObjectURL(file); item.appendChild(vid);
        } else {
          const img = document.createElement('img'); img.src = URL.createObjectURL(file); item.appendChild(img);
        }
        const removeBtn = document.createElement('button');
        removeBtn.className = 'preview-remove'; removeBtn.textContent = '×';
        removeBtn.onclick = () => { pendingFiles = pendingFiles.filter(f => f !== file); item.remove(); };
        item.appendChild(removeBtn);
        uploadPreview.appendChild(item);
      }
      fileInput.value = '';
    });

    async function loadGreeting() {
      try {
        const res = await fetch('/api/greeting');
        const data = await res.json();
        addMessage('ai', data.greeting);
      } catch (e) {
        addMessage('ai', "Hi! I'm David with ChargeWizards. How can I help with your EV charger installation?");
      }
      // Show suggestions after greeting with a slight delay
      setTimeout(() => {
        const s = document.getElementById('suggestions');
        if (s) s.style.display = '';
      }, 400);
    }
    loadGreeting();

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = messageInput.value.trim();
      if (!message && pendingFiles.length === 0) return;

      const suggestions = document.getElementById('suggestions');
      if (suggestions) suggestions.style.display = 'none';

      let uploadedFiles = [];
      if (pendingFiles.length > 0) {
        const formData = new FormData();
        formData.append('sessionId', sessionId);
        pendingFiles.forEach(f => formData.append('files', f));
        try {
          const uploadRes = await fetch('/api/upload', { method: 'POST', body: formData });
          const uploadData = await uploadRes.json();
          if (uploadData.files) uploadedFiles = uploadData.files;
        } catch (err) { console.error('Upload error:', err); }
        pendingFiles = [];
        uploadPreview.innerHTML = '';
      }

      const imageHtml = uploadedFiles.map(f =>
        f.type.startsWith('video/')
          ? `<video src="${f.url}" controls style="max-width:200px;border-radius:10px"></video>`
          : `<img src="${f.url}" onclick="window.open('${f.url}')">`
      ).join('');

      addMessage('user', (message || '') + (imageHtml ? `<div class="message-images">${imageHtml}</div>` : ''));
      messageInput.value = '';

      const typingIndicator = addTypingIndicator();
      messageInput.disabled = true;
      sendBtn.disabled = true;

      let aiMessage = message || '';
      if (uploadedFiles.length > 0) {
        aiMessage += (aiMessage ? '\n' : '') + `[Customer attached ${uploadedFiles.length} photo(s): ${uploadedFiles.map(f=>f.originalName).join(', ')}]`;
      }

      try {
        const historyMsgs = [];
        document.querySelectorAll('.message').forEach(m => {
          if (m.querySelector('.typing-indicator')) return;
          const isUser = m.classList.contains('user');
          const content = m.querySelector('.message-content')?.textContent?.trim();
          if (content) historyMsgs.push({ role: isUser ? 'user' : 'assistant', content });
        });

        const response = await fetch('/api/webchat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, messages: historyMsgs })
        });
        const data = await response.json();
        typingIndicator.remove();
        addMessage('ai', data.response);
      } catch (error) {
        typingIndicator.remove();
        addMessage('ai', "Sorry, I'm having trouble connecting. Please call us at (650) 542-8877.");
      }

      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.focus();
    });

    function addMessage(type, content) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      const avatarHtml = type === 'ai' ? '<div class="msg-avatar">CW</div>' : '';
      div.innerHTML = `${avatarHtml}<div class="message-content">${content}</div>`;
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addTypingIndicator() {
      const div = document.createElement('div');
      div.className = 'message ai';
      div.innerHTML = `<div class="msg-avatar">CW</div><div class="typing-indicator active"><span></span><span></span><span></span></div>`;
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return div;
    }

    function sendSuggestion(text) {
      messageInput.value = text;
      chatForm.dispatchEvent(new Event('submit'));
    }

    messageInput.focus();
  </script>
</body>
</html>
