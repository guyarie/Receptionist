<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with David — ChargeWizards</title>
  <link rel="icon" href="https://static.wixstatic.com/media/a8309b_c2b62d0e09004a0e9e2e10c3773f66c3~mv2.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .brand-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 500px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
    }

    .brand-text h2 {
      font-size: 16px;
      color: #1a73e8;
      font-weight: 700;
    }

    .brand-text p {
      font-size: 12px;
      color: #666;
    }

    .brand-badge {
      margin-left: auto;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
    }

    .chat-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 500px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .chat-header {
      background: linear-gradient(135deg, #1a73e8 0%, #0d5bba 100%);
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    
    .chat-header h1 { font-size: 18px; font-weight: 600; }
    .chat-header p { font-size: 13px; opacity: 0.85; margin-top: 2px; }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #fafbfc;
    }

    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    
    .message { margin-bottom: 14px; display: flex; align-items: flex-start; }
    .message.user { justify-content: flex-end; }
    
    .message-content {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 14px;
    }
    
    .message.ai .message-content {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    
    .message.user .message-content {
      background: #1a73e8;
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .message-label {
      font-size: 11px;
      color: #999;
      margin-bottom: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    
    .chat-input-container {
      padding: 16px 20px;
      background: white;
      border-top: 1px solid #eee;
    }
    
    .chat-input-form { display: flex; gap: 10px; align-items: center; }
    
    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e8ecf0;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .chat-input:focus { border-color: #1a73e8; }
    
    .chat-send-btn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .chat-send-btn:hover { background: #0d5bba; }
    .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    
    .suggestion-btn {
      background: #eef3ff;
      border: 1px solid #c8d8f8;
      color: #1a73e8;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    
    .suggestion-btn:hover {
      background: #1a73e8;
      color: white;
      border-color: #1a73e8;
    }
    
    .typing-indicator { display: none; }
    .typing-indicator.active { display: block; }
    .typing-text { font-size: 13px; color: #999; margin-bottom: 6px; font-style: italic; }
    
    .typing-indicator span {
      height: 7px; width: 7px; background: #1a73e8; border-radius: 50%;
      display: inline-block; margin-right: 3px; animation: typing 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    .photo-btn {
      font-size: 20px; cursor: pointer; padding: 8px;
      display: flex; align-items: center; border-radius: 50%;
      transition: background 0.2s;
    }
    .photo-btn:hover { background: #f0f0f0; }
    
    .upload-preview { display: flex; gap: 8px; padding: 0 20px; flex-wrap: wrap; }
    .upload-preview:empty { display: none; }
    .preview-item { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 2px solid #e0e0e0; }
    .preview-item img, .preview-item video { width: 100%; height: 100%; object-fit: cover; }
    .preview-remove { position: absolute; top: -4px; right: -4px; background: #ff4444; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .message-images { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .message-images img { max-width: 150px; max-height: 120px; border-radius: 8px; cursor: pointer; }

    .powered-by {
      text-align: center;
      padding: 10px;
      font-size: 11px;
      color: #aaa;
    }
    .powered-by a { color: #1a73e8; text-decoration: none; }

    @media(max-width: 540px) {
      body { padding: 0; }
      .brand-bar { display: none; }
      .chat-container { border-radius: 0; max-width: 100%; height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="brand-bar">
    <img class="brand-logo" src="https://static.wixstatic.com/media/a8309b_c2b62d0e09004a0e9e2e10c3773f66c3~mv2.png" alt="ChargeWizards" onerror="this.style.display='none'">
    <div class="brand-text">
      <h2>ChargeWizards</h2>
      <p>EV Charger Installation Experts</p>
    </div>
    <span class="brand-badge">⚡ Online</span>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">⚡</div>
      <div>
        <h1>David</h1>
        <p>EV Charging Specialist</p>
      </div>
    </div>
    
    <div class="chat-messages" id="messages">
      <div class="suggestions" id="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion('I need a charger installed')">🔌 Need a charger installed</button>
        <button class="suggestion-btn" onclick="sendSuggestion('I live in a condo — can you help?')">🏢 Condo / HOA install</button>
        <button class="suggestion-btn" onclick="sendSuggestion('Do I need a panel upgrade for an EV charger?')">⚡ Panel upgrade?</button>
        <button class="suggestion-btn" onclick="sendSuggestion('How much does installation cost?')">💰 How much?</button>
      </div>
    </div>
    
    <div class="chat-input-container">
      <div class="upload-preview" id="uploadPreview"></div>
      <form class="chat-input-form" id="chatForm">
        <label class="photo-btn" title="Share panel or install location photos">
          <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none">
          📷
        </label>
        <input type="text" class="chat-input" id="messageInput" placeholder="Ask about EV charger installation..." autocomplete="off">
        <button type="submit" class="chat-send-btn" id="sendBtn">Send</button>
      </form>
    </div>
    <div class="powered-by">Powered by <a href="https://www.chargewizards.com" target="_blank">ChargeWizards</a> · San Mateo, CA · (650) 542-8877</div>
  </div>
  
  <script>
    const messagesContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    
    let sessionId = 'web-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
    let pendingFiles = [];
    const fileInput = document.getElementById('fileInput');
    const uploadPreview = document.getElementById('uploadPreview');
    
    fileInput.addEventListener('change', (e) => {
      for (const file of e.target.files) {
        if (pendingFiles.length >= 5) break;
        pendingFiles.push(file);
        const item = document.createElement('div');
        item.className = 'preview-item';
        if (file.type.startsWith('video/')) {
          const vid = document.createElement('video');
          vid.src = URL.createObjectURL(file);
          item.appendChild(vid);
        } else {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(file);
          item.appendChild(img);
        }
        const removeBtn = document.createElement('button');
        removeBtn.className = 'preview-remove';
        removeBtn.textContent = '×';
        removeBtn.onclick = () => {
          pendingFiles = pendingFiles.filter(f => f !== file);
          item.remove();
        };
        item.appendChild(removeBtn);
        uploadPreview.appendChild(item);
      }
      fileInput.value = '';
    });
    
    async function loadGreeting() {
      try {
        const response = await fetch('/api/greeting');
        const data = await response.json();
        addMessage('ai', data.greeting);
      } catch (error) {
        addMessage('ai', "Hi! I'm David with ChargeWizards. How can I help with your EV charger installation?");
      }
    }
    
    loadGreeting();
    
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = messageInput.value.trim();
      if (!message && pendingFiles.length === 0) return;

      // Hide suggestions after first message
      const suggestions = document.getElementById('suggestions');
      if (suggestions) suggestions.style.display = 'none';
      
      let uploadedFiles = [];
      if (pendingFiles.length > 0) {
        const formData = new FormData();
        formData.append('sessionId', sessionId);
        pendingFiles.forEach(f => formData.append('files', f));
        try {
          const uploadRes = await fetch('/api/upload', { method: 'POST', body: formData });
          const uploadData = await uploadRes.json();
          if (uploadData.files) uploadedFiles = uploadData.files;
        } catch (err) { console.error('Upload error:', err); }
        pendingFiles = [];
        uploadPreview.innerHTML = '';
      }
      
      const imageHtml = uploadedFiles.map(f => 
        f.type.startsWith('video/') 
          ? `<video src="${f.url}" controls style="max-width:200px;border-radius:8px"></video>`
          : `<img src="${f.url}" onclick="window.open('${f.url}')">`
      ).join('');
      
      const displayMsg = (message || '') + (imageHtml ? `<div class="message-images">${imageHtml}</div>` : '');
      addMessage('user', displayMsg);
      messageInput.value = '';
      
      const typingIndicator = addTypingIndicator();
      messageInput.disabled = true;
      sendBtn.disabled = true;
      
      let aiMessage = message || '';
      if (uploadedFiles.length > 0) {
        const fileDesc = uploadedFiles.map(f => f.originalName).join(', ');
        aiMessage += (aiMessage ? '\n' : '') + `[Customer attached ${uploadedFiles.length} photo(s): ${fileDesc}]`;
      }
      
      try {
        const historyMsgs = [];
        document.querySelectorAll('.message').forEach(m => {
          if (m.querySelector('.typing-indicator')) return;
          const isUser = m.classList.contains('user');
          const content = m.querySelector('.message-content')?.textContent?.trim();
          if (content) historyMsgs.push({ role: isUser ? 'user' : 'assistant', content });
        });
        
        const response = await fetch('/api/webchat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, messages: historyMsgs })
        });
        const data = await response.json();
        typingIndicator.remove();
        addMessage('ai', data.response);
      } catch (error) {
        typingIndicator.remove();
        addMessage('ai', "Sorry, I'm having trouble connecting. Please call us at (650) 542-8877.");
      }
      
      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.focus();
    });
    
    function addMessage(type, content) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;
      const label = type === 'user' ? 'You' : 'David';
      messageDiv.innerHTML = `<div><div class="message-label">${label}</div><div class="message-content">${content}</div></div>`;
      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function addTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message ai';
      typingDiv.innerHTML = `<div><div class="message-label">David</div><div class="typing-indicator active"><div class="typing-text">David is typing...</div><span></span><span></span><span></span></div></div>`;
      messagesContainer.appendChild(typingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return typingDiv;
    }
    
    function sendSuggestion(text) {
      messageInput.value = text;
      chatForm.dispatchEvent(new Event('submit'));
    }
    
    messageInput.focus();
  </script>
</body>
</html>
