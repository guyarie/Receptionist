<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChargeWizards</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .chat-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 600px;
      height: 80vh;
      display: flex;
      flex-direction: column;
    }
    
    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px 12px 0 0;
    }
    
    .chat-header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }
    
    .chat-header p {
      font-size: 14px;
      opacity: 0.9;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f7f7f7;
    }
    
    .message {
      margin-bottom: 15px;
      display: flex;
      align-items: flex-start;
    }
    
    .message.user {
      justify-content: flex-end;
    }
    
    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.4;
    }
    
    .message.ai .message-content {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .message.user .message-content {
      background: #667eea;
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .message-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 5px;
      font-weight: 600;
    }
    
    .chat-input-container {
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      border-radius: 0 0 12px 12px;
    }
    
    .chat-input-form {
      display: flex;
      gap: 10px;
    }
    
    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }
    
    .chat-input:focus {
      border-color: #667eea;
    }
    
    .chat-send-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .chat-send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .chat-send-btn:active {
      transform: translateY(0);
    }
    
    .chat-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .typing-indicator {
      display: none;
      padding: 12px 16px;
      background: white;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      max-width: 200px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .typing-text {
      font-size: 13px;
      color: #999;
      margin-bottom: 6px;
      font-style: italic;
    }
    
    .typing-indicator.active {
      display: block;
    }
    
    .typing-indicator span {
      height: 8px;
      width: 8px;
      background: #999;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
      animation: typing 1.4s infinite;
    }
    
    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }
    
    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }
    
    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-10px);
      }
    }
    
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    
    .suggestion-btn {
      background: #f0f0f0;
      border: 1px solid #e0e0e0;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .suggestion-btn:hover {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    
    .photo-btn {
      font-size: 22px;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      border-radius: 50%;
      transition: background 0.2s;
    }
    
    .photo-btn:hover {
      background: #f0f0f0;
    }
    
    .upload-preview {
      display: flex;
      gap: 8px;
      padding: 0 20px;
      flex-wrap: wrap;
    }
    
    .upload-preview:empty {
      display: none;
    }
    
    .preview-item {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #e0e0e0;
    }
    
    .preview-item img, .preview-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .preview-remove {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .message-images {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    
    .message-images img {
      max-width: 150px;
      max-height: 120px;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .message-images img:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>ChargeWizards</h1>
      
    </div>
    
    <div class="chat-messages" id="messages">
      <!-- Greeting will be loaded dynamically -->
      
      <div class="suggestions">
        <button class="suggestion-btn" onclick="sendSuggestion('I just got a Tesla and need a charger at home')">Just got a Tesla</button>
        <button class="suggestion-btn" onclick="sendSuggestion('My condo HOA wants details about EV charger installation')">Condo / HOA install</button>
        <button class="suggestion-btn" onclick="sendSuggestion('I was told I need a panel upgrade — is that true?')">Do I need a panel upgrade?</button>
        <button class="suggestion-btn" onclick="sendSuggestion('How quickly can you get someone out here?')">How soon can you come?</button>
      </div>
    </div>
    
    <div class="chat-input-container">
      <div class="upload-preview" id="uploadPreview"></div>
      <form class="chat-input-form" id="chatForm">
        <label class="photo-btn" title="Add photos or videos">
          <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none">
          📷
        </label>
        <input 
          type="text" 
          class="chat-input" 
          id="messageInput" 
          placeholder="Type your message..."
          autocomplete="off"
        >
        <button type="submit" class="chat-send-btn" id="sendBtn">Send</button>
      </form>
    </div>
  </div>
  
  <script>
    const messagesContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    
    let sessionId = 'web-session-' + Date.now();
    let pendingFiles = [];
    const fileInput = document.getElementById('fileInput');
    const uploadPreview = document.getElementById('uploadPreview');
    
    fileInput.addEventListener('change', (e) => {
      for (const file of e.target.files) {
        if (pendingFiles.length >= 5) break;
        pendingFiles.push(file);
        const item = document.createElement('div');
        item.className = 'preview-item';
        if (file.type.startsWith('video/')) {
          const vid = document.createElement('video');
          vid.src = URL.createObjectURL(file);
          item.appendChild(vid);
        } else {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(file);
          item.appendChild(img);
        }
        const removeBtn = document.createElement('button');
        removeBtn.className = 'preview-remove';
        removeBtn.textContent = '×';
        removeBtn.onclick = () => {
          pendingFiles = pendingFiles.filter(f => f !== file);
          item.remove();
        };
        item.appendChild(removeBtn);
        uploadPreview.appendChild(item);
      }
      fileInput.value = '';
    });
    
    // Load greeting on page load
    async function loadGreeting() {
      try {
        const response = await fetch('/api/greeting');
        const data = await response.json();
        addMessage('ai', data.greeting);
      } catch (error) {
        console.error('Error loading greeting:', error);
        addMessage('ai', 'Hello! How can I help you today?');
      }
    }
    
    // Load model info on page load
    async function loadModelInfo() {
      try {
        const response = await fetch('/api/model-info');
        const data = await response.json();
        document.getElementById('modelInfo').textContent = `Model: ${data.model}`;
      } catch (error) {
        console.error('Error loading model info:', error);
        document.getElementById('modelInfo').textContent = 'Model: Unknown';
      }
    }
    
    // Load greeting and model info when page loads
    loadGreeting();
    loadModelInfo();
    
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = messageInput.value.trim();
      if (!message && pendingFiles.length === 0) return;
      
      // Upload files first if any
      let uploadedFiles = [];
      if (pendingFiles.length > 0) {
        const formData = new FormData();
        formData.append('sessionId', sessionId);
        pendingFiles.forEach(f => formData.append('files', f));
        try {
          const uploadRes = await fetch('/api/upload', { method: 'POST', body: formData });
          const uploadData = await uploadRes.json();
          if (uploadData.files) uploadedFiles = uploadData.files;
        } catch (err) {
          console.error('Upload error:', err);
        }
        pendingFiles = [];
        uploadPreview.innerHTML = '';
      }
      
      // Build display message with images
      const imageHtml = uploadedFiles.map(f => 
        f.type.startsWith('video/') 
          ? `<video src="${f.url}" controls style="max-width:200px;border-radius:8px"></video>`
          : `<img src="${f.url}" onclick="window.open('${f.url}')">`
      ).join('');
      
      const displayMsg = message + (imageHtml ? `<div class="message-images">${imageHtml}</div>` : '');
      addMessage('user', displayMsg);
      messageInput.value = '';
      
      // Show typing indicator
      const typingIndicator = addTypingIndicator();
      messageInput.disabled = true;
      sendBtn.disabled = true;
      
      // Build text message for AI (include file info)
      let aiMessage = message || '';
      if (uploadedFiles.length > 0) {
        const fileDesc = uploadedFiles.map(f => f.originalName).join(', ');
        aiMessage += (aiMessage ? '\n' : '') + `[Customer attached ${uploadedFiles.length} photo(s): ${fileDesc}]`;
      }
      
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message: aiMessage })
        });
        const data = await response.json();
        typingIndicator.remove();
        addMessage('ai', data.response);
      } catch (error) {
        typingIndicator.remove();
        addMessage('ai', 'Sorry, I encountered an error. Please try again.');
        console.error('Error:', error);
      }
      
      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.focus();
    });
    
    function addMessage(type, content) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;
      
      const label = type === 'user' ? 'You' : 'David';
      
      messageDiv.innerHTML = `
        <div>
          <div class="message-label">${label}</div>
          <div class="message-content">${content}</div>
        </div>
      `;
      
      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function addTypingIndicator() {
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message ai';
      typingDiv.innerHTML = `
        <div>
          <div class="message-label">David</div>
          <div class="typing-indicator active">
            <div class="typing-text">David is typing</div>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      `;
      messagesContainer.appendChild(typingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return typingDiv;
    }
    
    function sendSuggestion(text) {
      messageInput.value = text;
      chatForm.dispatchEvent(new Event('submit'));
    }
    
    // Focus input on load
    messageInput.focus();
  </script>
</body>
</html>
